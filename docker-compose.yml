services:
  diwa:
    build:
      context: .
      args:
        VITE_BASE_PATH: "${VITE_BASE_PATH:-/}"
    image: "${ZECZI_DIWA_IMAGE:-zeczi-diwa:local}"
    container_name: "${ZECZI_DIWA_CONTAINER_NAME:-zeczi-diwa}"
    restart: unless-stopped
    ports:
      - "${ZECZI_DIWA_HOST_PORT:-5180}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
